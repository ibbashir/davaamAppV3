# Netlify secrets scanning
#
# The build fails on `apiKey` in src/lib/firebase.ts. That value is the Firebase
# *web* config: a public client identifier that Firebase embeds in every browser
# bundle by design, so it cannot be kept secret and is not treated as one. What
# actually protects the project is the Storage/Firestore rules and the API key
# restrictions in the Google Cloud console — not hiding this string.
#
# Only that one value is exempted, rather than turning smart detection off, so
# the scan keeps guarding against a real secret being committed later.
[build.environment]
    SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBRVg4hfeqd1-9VLInPNpsU3BTRasgmSeI"

[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
